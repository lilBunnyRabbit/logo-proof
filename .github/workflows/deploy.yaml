# Proof has no build step — the site is the source. This workflow runs the
# scene smoke test, stages the runtime files into _site, and ships that.
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test scenes
        run: node tools/smoke.mjs
      - name: Stage site
        # Only the runtime files ship. docs/, tools/ and the README stay in the
        # repo — they are not part of the app.
        run: |
          mkdir -p _site
          cp -R index.html favicon.svg og.png css js _site/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
